services:
  app:
    container_name: rooter-back-app
    image: 208367987268.dkr.ecr.ap-northeast-2.amazonaws.com/rooter:latest
    restart: always
    ports:
      - "${SERVICE_HOST}:${SERVICE_PORT}:8080"
    environment:
      - JDBC_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_MAX_POOL_SIZE=${DB_MAX_POOL_SIZE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    container_name: rooter-back-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 1m
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
