# Configuration for the development environment

ktor { # this block will auto-reading by ktor lib
    development = true

    deployment {
        port = 8080
        environment = dev
    }
    application {
        modules = [com.github.nepyh.rooter.BootstrapperKt.appEntryModule]
    }
}

cors {
    allowedHosts = ""
    maxAgeSeconds = 3600
}

database {
    jdbcUrl = ${JDBC_URL}
    dbUser = ${DB_USER}
    dbPassword = ${DB_PASSWORD}
    dbMaxPoolSize = ${DB_MAX_POOL_SIZE}
}

storage {
    type = local
    baseDir = run/store
    # 클라이언트가 그대로 로드할 수 있는 절대 URL 이어야 한다 (상대 경로는 앱에서 표시되지 않음).
    # 아래 값은 폴백이고 실제 값은 STORAGE_BASE_URL 로 주입한다 — 예: http://localhost:8080/api/files
    baseUrl = "/api/files"
    baseUrl = ${?STORAGE_BASE_URL}
    baseRoute = files
    # s3 로 돌리고 싶으면 .env.dev.example 파일 참고
}

jwt {
    secret = ${JWT_SECRET}
    issuer = ${JWT_ISSUER}
}

llm {
    baseUrl = ${LLM_BASE_URL}
    apiKey = ${LLM_API_KEY}
    model = ${LLM_MODEL}
}

nice {
    apiKey = ${NICE_API_KEY}
    baseUrl = "https://open.neis.go.kr/hub"
}

oauth {
    googleClientId = ${?GOOGLE_CLIENT_ID}
    appleClientId = ${?APPLE_CLIENT_ID}
}

# 약관·개인정보 처리방침. 조항을 추가하려면 code 를 AgreementCode enum 에도 같이 넣어야 한다.
# version 이 바뀌면 기존 회원은 로그인 응답의 pendingAgreements 에 그 code 를 받고 재동의한다.
agreements = [
    {
        code = "TERMS"
        title = "이용약관"
        version = "2026-11-01"
        url = "https://nepyh.github.io/rooter-legal/terms/2026-11-01/"
    },
    {
        code = "PRIVACY"
        title = "개인정보 처리방침"
        version = "2026-11-01"
        url = "https://nepyh.github.io/rooter-legal/privacy/2026-11-01/"
    }
]


# DSN 이 비어 있으면 오류를 외부로 보내지 않는다.
sentry {
    dsn = ""
    dsn = ${?SENTRY_DSN}
    environment = "development"
    environment = ${?SENTRY_ENVIRONMENT}
    release = ""
    release = ${?SENTRY_RELEASE}
}

# Expo 푸시 액세스 토큰. Expo 의 "Enhanced Security for Push" 를 켰을 때만 필요하다 — 비어 있으면 토큰 없이 보낸다.
push {
    expoAccessToken = ""
    expoAccessToken = ${?EXPO_ACCESS_TOKEN}
}
