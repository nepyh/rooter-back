ktor { # this block will auto-reading by ktor lib
    deployment {
        port = 8080
    }
    application {
        modules = [com.github.nepyh.rooter.BootstrapperKt.devModule]
    }
}
storage {
    jdbcUrl = ${JDBC_URL}
    dbUser = ${DB_USER}
    dbPassword = ${DB_PASSWORD}
    dbMaxPoolSize = ${DB_MAX_POOL_SIZE}
}
