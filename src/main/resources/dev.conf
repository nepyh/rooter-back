# Configuration for the development environment

ktor { # this block will auto-reading by ktor lib
    development = true

    deployment {
        port = 8080
        environment = dev
    }
    application {
        modules = [com.github.nepyh.rooter.BootstrapperKt.appEntryModule]
    }
}

cors {
    allowedHosts = ""
    maxAgeSeconds = 3600
}

database {
    jdbcUrl = ${JDBC_URL}
    dbUser = ${DB_USER}
    dbPassword = ${DB_PASSWORD}
    dbMaxPoolSize = ${DB_MAX_POOL_SIZE}
}

storage {
    type = local

    // storage.type = local 을 사용할시의 설정
    baseDir = run/store
    baseUrl = /api/files
    baseRoute = files

    // storage.type = s3 를 사용할시의 설정
    awsRegion = ${AWS_REGION}
    awsBucket = ${AWS_BUCKET}
}
