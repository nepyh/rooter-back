# Configuration for the development environment with S3 file storage.
#
# Same as dev.conf except for the storage block. Requires AWS_REGION / AWS_BUCKET
# environment variables; credentials are resolved by the SDK default chain
# (local JVM: ~/.aws/config credential_process, container: roles-anywhere helper
# via AWS_EC2_METADATA_SERVICE_ENDPOINT).
#
ktor { # this block will auto-reading by ktor lib
    development = true

    deployment {
        port = 8080
        environment = dev
    }
    application {
        modules = [com.github.nepyh.rooter.BootstrapperKt.appEntryModule]
    }
}

cors {
    allowedHosts = ""
    maxAgeSeconds = 3600
}

database {
    jdbcUrl = ${JDBC_URL}
    dbUser = ${DB_USER}
    dbPassword = ${DB_PASSWORD}
    dbMaxPoolSize = ${DB_MAX_POOL_SIZE}
}

storage {
    type = s3
    awsRegion = ${AWS_REGION}
    awsBucket = ${AWS_BUCKET}
}

jwt {
    secret = ${JWT_SECRET}
    issuer = ${JWT_ISSUER}
}

nice {
    apiKey = ${NICE_API_KEY}
    baseUrl = "https://open.neis.go.kr/hub"
}


# DSN 이 비어 있으면 오류를 외부로 보내지 않는다.
sentry {
    dsn = ""
    dsn = ${?SENTRY_DSN}
    environment = "development"
    environment = ${?SENTRY_ENVIRONMENT}
    release = ""
    release = ${?SENTRY_RELEASE}
}

# 약관·개인정보 처리방침. 조항을 추가하려면 code 를 AgreementCode enum 에도 같이 넣어야 한다.
# version 이 바뀌면 기존 회원은 로그인 응답의 pendingAgreements 에 그 code 를 받고 재동의한다.
agreements = [
    {
        code = "TERMS"
        title = "이용약관"
        version = "2026-11-01"
        url = "https://nepyh.github.io/rooter-legal/terms/2026-11-01/"
    },
    {
        code = "PRIVACY"
        title = "개인정보 처리방침"
        version = "2026-11-01"
        url = "https://nepyh.github.io/rooter-legal/privacy/2026-11-01/"
    }
]
