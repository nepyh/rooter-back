# Configuration for the development environment with S3 file storage.
#
# Same as dev.conf except for the storage block. Requires AWS_REGION / AWS_BUCKET
# environment variables; credentials are resolved by the SDK default chain
# (local JVM: ~/.aws/config credential_process, container: roles-anywhere helper
# via AWS_EC2_METADATA_SERVICE_ENDPOINT).
#
ktor { # this block will auto-reading by ktor lib
    development = true

    deployment {
        port = 8080
        environment = dev
    }
    application {
        modules = [com.github.nepyh.rooter.BootstrapperKt.appEntryModule]
    }
}

cors {
    allowedHosts = ""
    maxAgeSeconds = 3600
}

database {
    jdbcUrl = ${JDBC_URL}
    dbUser = ${DB_USER}
    dbPassword = ${DB_PASSWORD}
    dbMaxPoolSize = ${DB_MAX_POOL_SIZE}
}

storage {
    type = s3
    awsRegion = ${AWS_REGION}
    awsBucket = ${AWS_BUCKET}
}

jwt {
    secret = ${JWT_SECRET}
    issuer = ${JWT_ISSUER}
}

nice {
    apiKey = ${NICE_API_KEY}
    baseUrl = "https://open.neis.go.kr/hub"
}
