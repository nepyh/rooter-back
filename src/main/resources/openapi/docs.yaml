openapi: "3.0.3"
info:
  title: Rooter API
  version: "1.0.0"
  description: Rooter 백엔드 API 문서
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버
  - url: https://anyone-enhance-lustrous.ngrok-free.dev
    description: ngrok 배포 서버
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: 헬스 체크
      description: 서버 상태 확인
      responses:
        "200":
          description: 서버 정상
  /api/example:
    get:
      tags:
        - Example
      summary: 예제 API
      description: 예제 텍스트 반환
      responses:
        "200":
          description: 예제 응답
          content:
            text/plain:
              schema:
                type: string
                example: 이건 예제 API 임
  /api/example/random:
    get:
      tags:
        - Example
      summary: 랜덤 숫자 반환
      description: 랜덤 숫자를 반환
      responses:
        "200":
          description: 랜덤 숫자
          content:
            text/plain:
              schema:
                type: integer
                example: 42
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      description: 이메일/비밀번호로 로그인하고 JWT 토큰을 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: test@example.com
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  username:
                    type: string
                  token:
                    type: string
        "401":
          description: 이메일 또는 비밀번호가 일치하지 않음
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: BAD_CREDENTIALS
                  message:
                    type: string
        "500":
          description: 서버 오류
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: 로그아웃
      responses:
        "200":
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "500":
          description: 서버 오류
  /api/users:
    post:
      tags:
        - User
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - username
                - password
              properties:
                email:
                  type: string
                  description: 320자 이하
                username:
                  type: string
                  description: 12자 이하
                password:
                  type: string
                  description: 8자 이상, 영문+숫자 포함
      responses:
        "201":
          description: 회원가입 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  username:
                    type: string
        "400":
          description: 사용할 수 없는 사용자 이름 (12자 초과)
        "406":
          description: 비밀번호 형식이 올바르지 않음
        "409":
          description: 이미 사용 중인 이메일
        "413":
          description: 이메일이 320자를 초과함 (code=EMAIL_TOO_LONG)
        "422":
          description: 이미 있는 사용자 이름
        "500":
          description: 서버 오류
  /api/users/{id}:
    get:
      tags:
        - User
      summary: 유저 정보 조회
      description: 유저 기본 정보와 학생 프로필을 함께 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                  email:
                    type: string
                  schoolId:
                    type: string
                  grade:
                    type: integer
                  classNumber:
                    type: integer
                  createdAt:
                    type: string
                  avatarImageKey:
                    type: string
                    nullable: true
        "400":
          description: 유효하지 않은 ID
        "404":
          description: 존재하지 않는 유저
        "500":
          description: 서버 오류
  /api/users/{id}/avatar:
    post:
      tags:
        - User
      summary: 아바타 이미지 업로드
      description: 이미지 파일을 업로드하고 유저의 avatarImageKey 를 갱신
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 업로드 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: integer
                  avatarImageKey:
                    type: string
        "400":
          description: 유효하지 않은 ID, 또는 이미지 파일 누락
        "404":
          description: 존재하지 않는 유저
        "500":
          description: 서버 오류
  /api/users/{id}/unavailable-times:
    get:
      tags:
        - User
      summary: 불가능 시간 목록 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    dayOfWeek:
                      type: integer
                      example: 1
                    startTime:
                      type: string
                      example: "09:00:00"
                    endTime:
                      type: string
                      example: "10:00:00"
        "400":
          description: 유효하지 않은 ID
        "404":
          description: 존재하지 않는 유저
        "500":
          description: 서버 오류
    post:
      tags:
        - User
      summary: 불가능 시간 추가
      description: 요일(1~7)과 시작/종료 시간을 등록
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dayOfWeek
                - startTime
                - endTime
              properties:
                dayOfWeek:
                  type: integer
                  description: 1(월) ~ 7(일)
                  example: 1
                startTime:
                  type: string
                  example: "09:00:00"
                endTime:
                  type: string
                  example: "10:00:00"
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  dayOfWeek:
                    type: integer
                  startTime:
                    type: string
                  endTime:
                    type: string
        "400":
          description: 유효하지 않은 ID, 또는 dayOfWeek 가 1~7 범위 밖 (code=INVALID_DAY_OF_WEEK)
        "404":
          description: 존재하지 않는 유저
        "500":
          description: 서버 오류
  /api/users/{id}/profile:
    post:
      tags:
        - User
      summary: 학생 프로필 생성
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - schoolId
                - grade
                - classNumber
              properties:
                schoolId:
                  type: string
                  description: 10자 이하
                grade:
                  type: integer
                classNumber:
                  type: integer
                studyStyle:
                  type: string
                  nullable: true
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  userId:
                    type: integer
                  schoolId:
                    type: string
                  grade:
                    type: integer
                  classNumber:
                    type: integer
                  studyStyle:
                    type: string
                    nullable: true
        "400":
          description: 유효하지 않은 ID, 또는 schoolId 가 10자 초과 (code=INVALID_SCHOOL_ID)
        "404":
          description: 존재하지 않는 유저
        "500":
          description: 서버 오류
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
