name: Swagger 문서 GitHub Pages 게시

# main 에 머지되면 앱을 dev 모드(Swagger 켜짐)로 잠깐 띄워 OpenAPI 문서를 받아서
# Swagger UI 정적 페이지로 GitHub Pages 에 올린다. 운영 서버의 Swagger 는 계속 꺼 둔다.
on:
  push:
    branches:
      - main
    paths:
      - "src/main/**"
      - "build.gradle.kts"
      - ".github/workflows/swagger-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swagger-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docs
          POSTGRES_PASSWORD: docs
          POSTGRES_DB: docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # 문서만 뽑는 실행이라 외부 값은 모두 가짜다 (LLM·NICE 는 호출되지 않는다)
    env:
      JDBC_URL: jdbc:postgresql://localhost:5432/docs
      DB_USER: docs
      DB_PASSWORD: docs
      DB_MAX_POOL_SIZE: "2"
      JWT_SECRET: docs-only
      JWT_ISSUER: docs-only
      LLM_BASE_URL: http://localhost:1
      LLM_API_KEY: docs-only
      LLM_MODEL: docs-only
      NICE_API_KEY: docs-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 앱을 dev 모드로 띄우고 OpenAPI 문서 받기
        run: |
          ./gradlew run --args="-config=dev.conf" > app.log 2>&1 &
          if ! curl -sf --retry 90 --retry-connrefused --retry-delay 2 -o /dev/null http://localhost:8080/api/health; then
            cat app.log
            exit 1
          fi
          mkdir -p site
          # 개발용 예제 API 는 문서에서 뺀다
          curl -sf http://localhost:8080/api/swagger/documentation.yaml \
            | jq 'del(.paths["/api/example"], .paths["/api/example/random"])' > site/openapi.json
          jq -e '.paths | length > 0' site/openapi.json > /dev/null

      - name: Swagger UI 페이지 만들기
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Rooter API</title>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css" />
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
            <script>
              window.ui = SwaggerUIBundle({ url: "./openapi.json", dom_id: "#swagger-ui", deepLinking: true });
            </script>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
