services:
  app:
    container_name: rooter-back-dev-app
    build: .
    restart: always
    # APP_CONFIG 로 사용할 conf 를 전환함 (미설정 시 dev.conf = local 파일 스토리지)
    # S3 로 띄우려면 .env 에 APP_CONFIG=dev-s3.conf + AWS_REGION/AWS_BUCKET + ROLESANYWHERE_* 를 넣고
    #   docker compose --profile roles-anywhere up
    command: ["-config=${APP_CONFIG:-dev.conf}"]
    ports:
      - "8080:8080"
    environment:
      - JDBC_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_MAX_POOL_SIZE=${DB_MAX_POOL_SIZE}

      - ALLOWED_HOSTS=와언더테일아시는구나 # dev 세팅에서 ALLOWED_HOSTS 는 짜피 anyHost 로 설정 되기에 씹힘

      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}

      - NICE_API_KEY=${NICE_API_KEY}

      # IAM Roles Anywhere helper 가 뜨는 경우에만 S3 인증에 사용됨 (없으면 무해)
      - AWS_EC2_METADATA_SERVICE_ENDPOINT=http://roles-anywhere-helper:9911
      # S3 스토리지용 값은 '설정된 경우에만' 전달함 (빈 문자열이 들어가면 HOCON 치환이 성공해버려
      # 잘못된 리전으로 조용히 요청하게 되므로 값 없는 형태로 통과시킴)
      - AWS_REGION
      - AWS_BUCKET
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # S3 스토리지로 컨테이너를 돌릴 때 필요한 서비스.
  # 로컬 jvm 은 ~/.aws/config 의 credential_process(= 이 helper 호출) 설정이 있어야 자격증명을 얻고,
  # 컨테이너는 그 홈 설정을 쓸 수 없어서 이 helper 가 가짜 EC2 IMDS 엔드포인트(:9911)를 띄워
  # SDK 의 IMDS 프로바이더가 자격증명을 얻도록 한다 (내부적으로는 인증서로 Roles Anywhere CreateSession 호출).
  roles-anywhere-helper:
    image: public.ecr.aws/rolesanywhere/credential-helper:latest
    profiles: ["roles-anywhere"]   # 이 프로필을 켤 때만 실행됨
    command: >
      serve
      --certificate /certs/client-cert.pem
      --private-key /certs/client-key.pem
      --trust-anchor-arn ${ROLESANYWHERE_TRUST_ANCHOR_ARN}
      --profile-arn ${ROLESANYWHERE_PROFILE_ARN}
      --role-arn ${ROLESANYWHERE_ROLE_ARN}
      --port 9911
    volumes:
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:9911:9911"   # 로컬호스트에만 바인딩 (외부 노출 금지)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9911/latest/meta-data/iam/security-credentials/"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-network

  db:
    container_name: rooter-back-dev-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - dev-storage:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 1m
    networks:
      - app-network

volumes:
  dev-storage:

networks:
  app-network:
    driver: bridge
