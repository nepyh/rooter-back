services:
  app:
    container_name: rooter-back-test-app
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - JDBC_URL=jdbc:postgresql://db:5432/main
      - DB_USER=user
      - DB_PASSWORD=wasans
      - DB_MAX_POOL_SIZE=10
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    container_name: rooter-back-test-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=wasans
      - POSTGRES_DB=main
    volumes:
      - storage:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-mydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 1m
    networks:
      - app-network

volumes:
  storage:

networks:
  app-network:
    driver: bridge
