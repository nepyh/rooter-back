services:
  app:
    container_name: rooter-back-dev-app
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - JDBC_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_MAX_POOL_SIZE=10
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    container_name: rooter-back-dev-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - dev-storage:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 1m
    networks:
      - app-network

volumes:
  dev-storage:

networks:
  app-network:
    driver: bridge
